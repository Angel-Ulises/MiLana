name: CETES — vigilar snapshot oficial

on:
  schedule:
    - cron: '37 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: check
        run: node scripts/inversion/check-cetes-reference.mjs
      - name: Abrir, actualizar o cerrar alerta
        uses: actions/github-script@v7
        env:
          CHANGED: ${{ steps.check.outputs.changed }}
          REMOTE_DATE: ${{ steps.check.outputs.remote_date }}
          PAYLOAD_B64: ${{ steps.check.outputs.payload_b64 }}
        with:
          script: |
            const title = '[CETES frescura] Actualizar snapshot oficial';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            const changed = process.env.CHANGED === 'true';
            if (!changed) {
              if (existing) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: 'La tabla oficial vuelve a coincidir con el snapshot versionado. Cierro la alerta automáticamente.' });
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
              }
              core.notice('Snapshot CETES sigue vigente.');
              return;
            }
            const payload = JSON.parse(Buffer.from(process.env.PAYLOAD_B64, 'base64').toString('utf8'));
            const rows = payload.remote.products.map((p) => `- ${p.displayTerm}: precio ${p.indicativePrice.toFixed(2)} · tasa ${p.grossAnnualRatePct.toFixed(2)}%`).join('\n');
            const body = `La tabla oficial de cetesdirecto cambió respecto al snapshot publicado por MiLana.\n\n**Fecha remota:** ${payload.remoteSourceDate}\n**Fecha versionada:** ${payload.currentSourceDate}\n\n### Cambios detectados\n${payload.changes.map((c) => `- ${c}`).join('\n')}\n\n### Lectura remota\n${rows}\n\nFuente: ${payload.sourceUrl}\n\n**No actualizar automáticamente.** Verificar la tabla oficial, revisar fecha/precios/tasas y después preparar un cambio versionado con pruebas.`;
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['data-freshness'] }).catch(async () => {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              });
            }
