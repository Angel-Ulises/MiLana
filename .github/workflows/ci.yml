name: CI — pruebas y build del repositorio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: repo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar caché de fuentes
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          echo "MILANA_CHROME=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          cache_home="$RUNNER_TEMP/milana-cache"
          mkdir -p "$cache_home/fontconfig"
          test -w "$cache_home/fontconfig"
          echo "XDG_CACHE_HOME=$cache_home" >> "$GITHUB_ENV"
          echo "Fontconfig cache: $cache_home/fontconfig (writable)"

      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build completo
        run: npm run build

      - name: Preparar paquete estático Cloudflare sin publicar
        run: npm run package:cloudflare

      - name: Node para Wrangler local
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar HTTP en Pages local sin credenciales
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm exec --yes --package wrangler@4.149.0 -- wrangler --version
          npm exec --yes --package wrangler@4.149.0 -- wrangler pages dev dist-cloudflare-preview --ip 127.0.0.1 --port 8788 --compatibility-date=2026-10-06 > .qa/cloudflare/wrangler-ci.log 2>&1 &
          pages_pid=$!
          trap 'kill "$pages_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8788/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$pages_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat .qa/cloudflare/wrangler-ci.log; exit 1; fi
          npm run verify:cloudflare -- http://127.0.0.1:8788

      - name: Guardar evidencia Cloudflare
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preparacion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .qa/cloudflare/*.json
            .qa/cloudflare/*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Restaurar Node del build para regresiones existentes
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capturar recorridos en escritorio y móvil
        run: node --experimental-websocket scripts/capturar-recorridos.mjs

      - name: Guardar capturas de revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorridos-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa/decision-journey/
          retention-days: 7
          if-no-files-found: ignore

      - name: Capturar práctica para principiantes
        run: node --experimental-websocket scripts/capturar-principiantes.mjs

      - name: Guardar evidencia de principiantes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: principiantes-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa/budget-practice/
          retention-days: 7
          if-no-files-found: ignore

      - name: Diff limpio
        run: git diff --check

      - name: Verificar arranque con caché fría y fallos de red
        run: node --experimental-websocket scripts/verificar-arranque.mjs

      - name: Guardar evidencia de arranque
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arranque-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa/startup/
          retention-days: 7
          if-no-files-found: ignore
