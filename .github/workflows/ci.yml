name: CI — pruebas del repositorio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: repo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pruebas unitarias
        run: npm test

      - name: Diff limpio
        run: git diff --check
