name: CI — pruebas y build del repositorio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: repo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build completo
        run: npm run build

      - name: CLS portada con fuentes reales y red demorada
        run: node --experimental-websocket scripts/verificar-home-cls.mjs

      - name: Guardar mediciones CLS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-cls
          path: qa-results/home-cls.json
          if-no-files-found: ignore

      - name: Diff limpio
        run: git diff --check
