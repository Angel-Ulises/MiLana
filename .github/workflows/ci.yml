name: CI — pruebas y build del repositorio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: repo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: ${{ runner.temp }}/milana-cache
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar caché de fuentes
        run: mkdir -p "$XDG_CACHE_HOME/fontconfig"

      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build completo
        run: npm run build

      - name: Diff limpio
        run: git diff --check
