name: Cierre calculadoras 2026

on:
  push:
    branches:
      - fix/cierre-calculadoras-visual-2026-09-14
    paths:
      - .github/workflows/cierre-calculadoras.yml

permissions:
  contents: write

jobs:
  validar-cierre-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cierre-calculadoras-visual-2026-09-14
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Limpiar una frase heredada del resultado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')
          old = 'comisiones, bonos u otros conceptos integrables requieren revisión específica.'
          new = 'comisiones, bonos u otros conceptos integrables requieren un cálculo adicional con sus propios datos.'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar sitio
        run: npm run build

      - name: Comprobar que no quedan mensajes públicos de suspensión
        run: |
          ! grep -RniE "Importes en revisión|Cálculo en revisión|generación de importes está suspendida|importe permanece suspendido|requieren revisión específica" src public --exclude-dir=images

      - name: Guardar limpieza validada
        run: |
          git config user.name "MiLana automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No hay limpieza adicional que confirmar"
            exit 0
          fi
          git commit -m "Afinar mensaje final de finiquito"
          git push origin HEAD:fix/cierre-calculadoras-visual-2026-09-14
