name: Vista previa — Cloudflare Pages

# Publica cada PR hacia main en una URL temporal de Cloudflare Pages (rama de vista previa, nunca producción).
# Requiere los secretos CLOUDFLARE_API_TOKEN (permiso «Cloudflare Pages: Edit») y CLOUDFLARE_ACCOUNT_ID,
# y la variable CLOUDFLARE_PAGES_PROJECT (por defecto «milana»). Sin secretos, el job se omite sin fallar.
on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-cloudflare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vista-previa:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'milana' }}
    steps:
      - name: Comprobar configuración
        id: config
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; se omite la vista previa."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.listo == 'true'
        uses: actions/checkout@v4

      - name: Node
        if: steps.config.outputs.listo == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        if: steps.config.outputs.listo == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      # El CI completo (pruebas y auditorías con navegador) corre en ci.yml; aquí sólo se genera el sitio estático.
      - name: Generar sitio
        if: steps.config.outputs.listo == 'true'
        run: |
          npx vite build
          for s in generar-paginas generar-carreras generar-ocupaciones generar-comparador-carreras enlazar-profesiones-asesor generar-estados enlazar-vivienda-estados generar-comparador-estados generar-finanzas generar-match generar-asesor generar-inversion generar-economia inyectar-seo-estatico mejorar-guias-seo inyectar-social-preview completar-meta-estaticos generar-sitemap-final inyectar-analytics-estaticos aplicar-orbita-base normalizar-urls-estaticas; do
            node "scripts/$s.mjs"
          done

      - name: Crear proyecto si no existe
        if: steps.config.outputs.listo == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.0 pages project create "$CF_PROJECT" --production-branch main || true

      - name: Publicar vista previa
        if: steps.config.outputs.listo == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.0'
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true

      - name: Comentar URL en el PR
        if: steps.config.outputs.listo == 'true'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const marca = '<!-- vista-previa-cloudflare -->';
            const cuerpo = `${marca}\n**Vista previa (Cloudflare Pages)** para \`${context.payload.pull_request.head.sha.slice(0, 7)}\`\n\n- Esta versión: ${process.env.URL}\n- Alias del PR: ${process.env.ALIAS || 'N/D'}\n- MiLana Match: ${(process.env.ALIAS || process.env.URL).replace(/\/$/, '')}/finanzas/match\n\nNo es producción: noindex, sin analítica ni anuncios (sólo se activan en www.milanaaqui.mx).`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const previos = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mio = previos.find((c) => c.body?.includes(marca));
            if (mio) await github.rest.issues.updateComment({ owner, repo, comment_id: mio.id, body: cuerpo });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: cuerpo });
