name: Radar económico — detectar candidatos

on:
  schedule:
    # 07:20, 11:20 y 16:20 aprox. en Ciudad de México mientras rige UTC-6.
    - cron: '20 13,17,22 * * 1-5'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/radar/**'
      - 'src/data/radar-sources.json'
      - 'tests/radar-collector.test.mjs'
      - 'tests/radar-promotion.test.mjs'
      - '.github/workflows/radar-collector.yml'
      - '.github/workflows/radar-promote.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/radar/**'
      - 'src/data/radar-sources.json'
      - 'tests/radar-collector.test.mjs'
      - 'tests/radar-promotion.test.mjs'
      - '.github/workflows/radar-collector.yml'
      - '.github/workflows/radar-promote.yml'

concurrency:
  group: radar-economico-collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detectar:
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: ${{ runner.temp }}/milana-cache
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar caché de fuentes
        run: mkdir -p "$XDG_CACHE_HOME/fontconfig"

      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Pruebas unitarias
        run: npm test

      - name: Recolectar fuentes oficiales
        run: node scripts/radar/collect.mjs --output tmp/radar-candidates.json

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-candidates
          path: tmp/radar-candidates.json
          if-no-files-found: warn
          retention-days: 14

      - name: Gestionar candidatos y salud sin publicar
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('tmp/radar-candidates.json', 'utf8'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // En pull requests solo validamos conectividad/parsers. No abrimos ni cerramos Issues.
            if (context.eventName === 'pull_request') {
              core.info(`PR de validación: ${payload.candidateCount} candidatos, ${payload.health.filter(x => x.ok).length}/${payload.health.length} fuentes sanas.`);
              return;
            }

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const bodies = allIssues.map((issue) => issue.body || '').join('\n');

            for (const candidate of payload.candidates) {
              const marker = `<!-- radar-key:${candidate.key} -->`;
              if (bodies.includes(marker)) continue;

              const machinePayload = Buffer.from(JSON.stringify(candidate), 'utf8').toString('base64');
              const draft = candidate.editorial?.draft || {};
              const tools = (draft.tools || candidate.editorial.tools || []).map((href) => `- ${href}`).join('\n');
              const fact = candidate.detectedFact ? `\n**Dato detectado automáticamente:** ${candidate.detectedFact}` : '';
              const period = candidate.period ? `\n**Periodo del dato:** ${candidate.period}` : '';
              const dataStatus = draft.dataStatus ? `\n**Estatus del dato:** ${draft.dataStatus}` : '';
              const body = [
                marker,
                `<!-- radar-payload:${machinePayload} -->`,
                '## Candidato automático del Radar económico',
                '',
                '> **NO PUBLICADO.** Este Issue registra y preestructura una novedad oficial para revisión editorial.',
                '',
                `**Institución:** ${candidate.institution}`,
                `**Fuente:** ${candidate.sourceName}`,
                `**Fecha de publicación detectada:** ${candidate.publishedAt}`,
                `**Categoría:** ${candidate.category}`,
                `**Tipo de señal:** ${candidate.signalType || 'publicacion-oficial'}`,
                `**URL oficial:** ${candidate.sourceUrl}`,
                fact,
                period,
                dataStatus,
                '',
                '### Título detectado',
                candidate.title,
                '',
                '### Resumen recibido de la fuente',
                candidate.summary || '_Sin resumen estructurado; abrir la fuente antes de redactar._',
                '',
                '## Preborrador estructural',
                '',
                '> Se genera solo con datos de la fuente y reglas fijas. No sustituye la verificación editorial.',
                '',
                '### Qué pasó',
                draft.whatHappened || candidate.summary || candidate.title,
                '',
                '### Por qué importa',
                draft.whyItMatters || candidate.editorial.whyItMatters,
                '',
                '### A quién afecta',
                draft.audience || candidate.editorial.audience,
                '',
                '### Encuadre práctico',
                draft.actionFrame || 'Usar el dato como contexto y verificar la fuente oficial antes de conectarlo con una decisión personal.',
                '',
                '### Herramientas MiLana candidatas',
                tools || '- Sin herramienta asignada',
                '',
                '## Promoción controlada',
                '',
                'Si la fuente y el dato ya fueron revisados, el propietario del repositorio puede comentar exactamente `/preparar`.',
                'Ese comando solo prepara un **Pull Request en borrador** con validaciones adicionales. No publica ni hace merge a `main`.',
                '',
                '### Guardas antes de publicar',
                '- [ ] Abrir la fuente oficial y verificar el dato completo, fecha, periodo y alcance.',
                '- [ ] Confirmar si el dato es observado, preliminar, estimado o una decisión institucional.',
                '- [ ] Revisar y reescribir el preborrador: no publicarlo literalmente por automatismo.',
                '- [ ] Mantener “qué pasó → por qué importa → a quién afecta → qué herramienta ayuda”.',
                '- [ ] Evitar consejo financiero personalizado, causalidad no demostrada o lenguaje alarmista.',
                '- [ ] Confirmar que no existe ya una pieza equivalente en `/economia`.',
                '- [ ] Solo después, añadir una pieza revisada a `src/data/economia.json`.',
                '',
                `**Estado:** ${candidate.status}`,
                '',
                '_Este workflow recolector conserva `contents: read`: por sí solo no puede publicar ni modificar contenido._'
              ].filter(Boolean).join('\n');

              await github.rest.issues.create({
                owner,
                repo,
                title: `[Radar candidato] ${candidate.title.slice(0, 120)}`,
                body,
              });
            }

            for (const source of payload.health.filter((item) => !item.ok)) {
              const marker = `<!-- radar-health:${source.sourceId} -->`;
              const openHealth = allIssues.find((issue) => issue.state === 'open' && (issue.body || '').includes(marker));
              if (openHealth) continue;
              await github.rest.issues.create({
                owner,
                repo,
                title: `[Radar salud] Revisar fuente ${source.sourceId}`,
                body: [
                  marker,
                  '## El recolector no pudo leer una fuente oficial',
                  '',
                  `**Fuente:** ${source.sourceId}`,
                  `**Error:** ${source.error}`,
                  '',
                  'Esto no publica nada y no bloquea las demás fuentes. Revisar si cambió el endpoint, el formato o si fue un fallo temporal.',
                ].join('\n'),
              });
            }

            // Si una fuente se recuperó, cerramos automáticamente su alerta técnica anterior.
            for (const source of payload.health.filter((item) => item.ok)) {
              const marker = `<!-- radar-health:${source.sourceId} -->`;
              const openAlerts = allIssues.filter((issue) => issue.state === 'open' && (issue.body || '').includes(marker));
              for (const issue of openAlerts) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Fuente recuperada automáticamente: ${source.parsedItems} entradas parseadas en esta corrida. Cierro la alerta de salud.`
                });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
            }
