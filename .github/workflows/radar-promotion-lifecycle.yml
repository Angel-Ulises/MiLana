name: Radar económico — cerrar ciclo de promoción

on:
  pull_request:
    types: [closed]

jobs:
  cerrar-ciclo:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'radar/promotion-') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write
    steps:
      - name: Sincronizar Issue y limpiar branch técnico
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const match = branch.match(/^radar\/promotion-(\d+)-/);

            if (!match) {
              core.setFailed(`No pude recuperar el Issue origen desde el branch ${branch}`);
              return;
            }

            const issueNumber = Number(match[1]);
            const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const merged = pr.merged === true;
            const marker = '<!-- radar-source-status -->';
            let body;

            if (merged) {
              const slugMatch = String(pr.body || '').match(/\*\*Slug propuesto:\*\*\s+(\/economia\/[a-z0-9-]+)/i);
              const publicPath = slugMatch?.[1] || null;
              const publicUrl = publicPath ? `https://www.milanaaqui.mx${publicPath}` : null;
              body = [
                marker,
                '## ✅ PUBLICADO',
                '',
                `PR fusionado: #${pr.number} — ${pr.html_url}`,
                publicUrl ? `Ruta pública: ${publicUrl}` : 'La propuesta fue fusionada a `main`; no pude extraer la ruta pública del cuerpo del PR.',
                '',
                'El Radar reconocerá este candidato por `radarKey` y no deberá proponerlo de nuevo.'
              ].join('\n');

              if (issue.data.state !== 'closed') {
                await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'closed' });
              }
            } else {
              body = [
                marker,
                '## ⚪ DESCARTADO',
                '',
                `PR cerrado sin merge: #${pr.number} — ${pr.html_url}`,
                '',
                '**Estado público:** no publicado.',
                'El branch técnico se descarta. Si quieres intentarlo de nuevo desde el `main` actual, comenta `/preparar` en este Issue.'
              ].join('\n');

              if (issue.data.state === 'closed') {
                await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'open' });
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100
            });
            const previous = comments.find((comment) => (comment.body || '').includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              core.info(`Branch técnico eliminado: ${branch}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.warning(`El branch ${branch} ya no existe o no pudo eliminarse porque su estado cambió.`);
              } else {
                throw error;
              }
            }
