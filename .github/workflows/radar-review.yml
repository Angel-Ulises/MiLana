name: Radar económico — revisar PR de promoción

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: radar-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisar:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'radar/promotion-') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout del PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar comparación contra base exacta
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p tmp
          git show "$BASE_SHA:src/data/economia.json" > tmp/economia.base.json
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > tmp/changed-files.txt

      - name: Ejecutar pruebas del repositorio
        run: npm test

      - name: Auditar promoción
        id: audit
        run: |
          node scripts/radar/review-promotion.mjs \
            --base tmp/economia.base.json \
            --head src/data/economia.json \
            --registry src/data/radar-sources.json \
            --files tmp/changed-files.txt \
            --output tmp/radar-review.json \
            --markdown tmp/radar-review.md
          node -e "const r=require('./tmp/radar-review.json'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'ok='+(r.ok?'true':'false')+'\n')"

      - name: Publicar o actualizar dictamen en el PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- radar-pr-review -->';
            const body = fs.existsSync('tmp/radar-review.md')
              ? fs.readFileSync('tmp/radar-review.md', 'utf8')
              : `${marker}\n## ⛔ Revisión automática del Radar\n\nEl revisor no pudo generar su reporte. Revisar el log del workflow antes de fusionar.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find((comment) => (comment.body || '').includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Actualizar semáforo en el Issue origen
        if: always()
        uses: actions/github-script@v7
        env:
          RADAR_OK: ${{ steps.audit.outputs.ok }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const match = String(pr.head.ref || '').match(/^radar\/promotion-(\d+)-/);
            if (!match) {
              core.setFailed(`No pude recuperar el Issue origen desde ${pr.head.ref}`);
              return;
            }

            const issueNumber = Number(match[1]);
            const marker = '<!-- radar-source-status -->';
            const ok = process.env.RADAR_OK === 'true';
            let blockers = [];
            if (fs.existsSync('tmp/radar-review.json')) {
              try {
                blockers = JSON.parse(fs.readFileSync('tmp/radar-review.json', 'utf8')).blockers || [];
              } catch (error) {
                core.warning(`No pude leer radar-review.json: ${error.message}`);
              }
            }

            const body = ok
              ? [
                  marker,
                  '## 🟢 LISTO PARA REVISIÓN HUMANA',
                  '',
                  `PR técnico: #${pr.number} — ${pr.html_url}`,
                  '',
                  '**Automático:** pruebas del repositorio y guardas del Radar aprobadas.',
                  '**Tu revisión:** confirma fuente/cifra, copy, foto y vista previa antes del merge.',
                  '',
                  '**Estado público:** todavía no publicado.'
                ].join('\n')
              : [
                  marker,
                  '## 🔴 BLOQUEADO',
                  '',
                  `PR técnico: #${pr.number} — ${pr.html_url}`,
                  '',
                  '**No fusionar.** La revisión automática no terminó limpia.',
                  '',
                  blockers.length ? '### Bloqueos detectados' : 'Revisa el dictamen del PR o el log del workflow para identificar el fallo.',
                  ...blockers.slice(0, 5).map((item) => `- ${item}`),
                  '',
                  '**Estado público:** no publicado.'
                ].filter(Boolean).join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100
            });
            const previous = comments.find((comment) => (comment.body || '').includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }

      - name: Bloquear check si hay guardas incumplidas
        if: steps.audit.outputs.ok != 'true'
        run: |
          echo 'El PR de promoción incumple una o más guardas del Radar.' >&2
          cat tmp/radar-review.md >&2 || true
          exit 1
