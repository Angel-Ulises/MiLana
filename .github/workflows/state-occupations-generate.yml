name: Generar ocupaciones estatales Data México — temporal

on:
  push:
    branches:
      - chatgpt/state-occupations-generate-20261001
    paths:
      - '.github/workflows/state-occupations-generate.yml'
      - 'scripts/states/generate_state_occupations.py'
      - 'src/data/estados.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar JSON desde API oficial
        run: python3 scripts/states/generate_state_occupations.py
      - name: Validar forma básica
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('src/data/stateOccupations.json'))
          assert d['period']=='2026-T1'
          assert len(d['states'])==32
          assert all(len(s['occupations'])==8 for s in d['states'])
          assert sum(len(s['occupations']) for s in d['states'])==256
          print('OK: 32 estados / 256 ocupaciones')
          PY
      - name: Commit temporal del snapshot generado
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/stateOccupations.json
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git commit -m 'Genera snapshot Data México 2026-T1 por estado'
          git push origin HEAD:chatgpt/state-occupations-generate-20261001
