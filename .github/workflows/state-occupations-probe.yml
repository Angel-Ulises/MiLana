name: Probe Data México — ocupaciones por estado

on:
  push:
    branches:
      - chatgpt/state-occupations-probe-20261001
    paths:
      - '.github/workflows/state-occupations-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar ENOE 2026-T1 para Nuevo León
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          params = {
              'Population Classification': '1',
              'Quarter': '20261',
              'State': '19',
              'cube': 'inegi_enoe',
              'drilldowns': 'State,Occupation',
              'measures': 'Workforce,Monthly Wage,Number of Records',
              'parents': 'true',
              'sparse': 'false',
              'locale': 'es',
          }
          url = 'https://www.economia.gob.mx/datamexico/api/data?' + urllib.parse.urlencode(params)
          print('URL', url)
          req = urllib.request.Request(url, headers={'User-Agent': 'MiLana-data-probe/1.0'})
          with urllib.request.urlopen(req, timeout=60) as r:
              raw = r.read()
          print('bytes', len(raw))
          d = json.loads(raw)
          print('keys', list(d.keys()))
          rows = d.get('data', [])
          print('rows', len(rows))
          for row in sorted(rows, key=lambda r: float(r.get('Workforce') or 0), reverse=True)[:15]:
              print(row)
          PY
